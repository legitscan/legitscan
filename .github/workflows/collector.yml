name: collector

# Finds Robinhood Chain coins and refreshes their data into Cloudflare D1, every 5 minutes.
# Not live until the owner says yes: needs the LegitScan GitHub repo, a D1 database and three secrets.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "1 = one long run (all Pons launches, all markets). Use once after creating the database."
        default: "0"

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev
      - run: node run-ci.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RPC_URLS: ${{ secrets.RPC_URLS }}
          LOGS_RPC_URLS: ${{ secrets.LOGS_RPC_URLS }}
          BACKFILL: ${{ inputs.backfill }}
